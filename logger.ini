[loggers]
keys=root,base

[handlers]
keys=fileHandler_base

[formatters]
keys=fileFormatter

[logger_root]
level=INFO
handlers=

[logger_base]
handlers=fileHandler_base
level=INFO
qualname=base
propagate=0

[handler_fileHandler_base]
class=FileHandler
level=INFO
formatter=fileFormatter
args=('./logs/base_logs.log','a',)

[formatter_fileFormatter]
format=f"%(asctime)s - [%(levelname)s] - %(name)s - (%(filename)s).%(funcName)s(%(lineno)d) - %(message)s"
datefmt='%d-%m-%Y %H:%M:%S
