[tool.poetry]
name = "notification-service"
version = "0.1.0"
description = ""
authors = ["Johannes <tolstoy.work@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pika = "1.3.2"
black = "24.3.0"
isort = "5.13.2"
flake8 = "7.0.0"
pydantic = "2.6.4"
aioboto3 = "12.3.0"
motor = "3.4.0"
pre-commit = "3.7.0"
pydantic-settings = "2.2.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
asyncio_mode="auto"
